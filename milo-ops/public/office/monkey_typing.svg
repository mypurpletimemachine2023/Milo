<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs><style>.o{shape-rendering:crispEdges}</style></defs>
  <g class="o">
    <rect width="32" height="32" fill="none"/>
    <!-- body -->
    <rect x="10" y="14" width="12" height="12" fill="#6b3f2a"/>
    <rect x="12" y="12" width="8" height="2" fill="#6b3f2a"/>
    <!-- arms forward (typing) -->
    <rect x="9" y="18" width="4" height="2" fill="#5a3424"/>
    <rect x="19" y="18" width="4" height="2" fill="#5a3424"/>
    <!-- head -->
    <rect x="11" y="6" width="10" height="8" fill="#7a4a31"/>
    <rect x="13" y="8" width="6" height="4" fill="#d8b08c"/>
    <!-- ears -->
    <rect x="9" y="8" width="2" height="4" fill="#7a4a31"/>
    <rect x="21" y="8" width="2" height="4" fill="#7a4a31"/>
    <rect x="9" y="9" width="1" height="2" fill="#d8b08c"/>
    <rect x="22" y="9" width="1" height="2" fill="#d8b08c"/>
    <!-- eyes -->
    <rect x="14" y="9" width="1" height="1" fill="#1a1a1a"/>
    <rect x="17" y="9" width="1" height="1" fill="#1a1a1a"/>
    <!-- mouth -->
    <rect x="15" y="11" width="2" height="1" fill="#8b5a3c"/>
    <!-- feet -->
    <rect x="11" y="26" width="4" height="2" fill="#5a3424"/>
    <rect x="17" y="26" width="4" height="2" fill="#5a3424"/>
  </g>
</svg>

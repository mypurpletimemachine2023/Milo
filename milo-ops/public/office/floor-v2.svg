<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <!-- Base tile (16x16) -->
    <pattern id="tile" patternUnits="userSpaceOnUse" width="16" height="16">
      <image href="/office/placeholders/floor_tile_16.png" x="0" y="0" width="16" height="16"/>
    </pattern>

    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(0,0,0,0.10)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0.55)"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.55)"/>
    </filter>

    <style>
      .label{font: 900 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; letter-spacing:2px; fill: rgba(255,255,255,0.65);}
      .room{fill: rgba(255,255,255,0.04); stroke: rgba(255,255,255,0.10); stroke-width: 2;}
      .sign{fill: rgba(0,0,0,0.45); stroke: rgba(255,255,255,0.12);}
      .signText{font: 800 10px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: rgba(255,255,255,0.85);}
    </style>
  </defs>

  <!-- Whole floor -->
  <rect x="0" y="0" width="1000" height="600" fill="url(#tile)" opacity="0.92"/>
  <rect x="0" y="0" width="1000" height="600" fill="url(#v)"/>

  <!-- Central hallway spine -->
  <rect x="430" y="30" width="140" height="540" rx="22" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.06)"/>

  <!-- Rooms (aligned to current ROOMS rectangles) -->
  <!-- Left wing -->
  <rect class="room" x="34" y="58" width="380" height="240" rx="18"/>
  <text class="label" x="52" y="86">LIBRARY (INTERNET)</text>

  <rect class="room" x="34" y="318" width="380" height="242" rx="18"/>
  <text class="label" x="52" y="346">BREAK ROOM (IDLE)</text>

  <!-- Right wing -->
  <rect class="room" x="586" y="58" width="380" height="240" rx="18"/>
  <text class="label" x="604" y="86">LOCKSMITH OFFICE</text>

  <rect class="room" x="586" y="318" width="380" height="242" rx="18"/>
  <text class="label" x="604" y="346">LUNCH ROOM (DEBRIEF)</text>

  <!-- Sub-area plaques (the 6 labs) -->
  <g filter="url(#shadow)">
    <!-- DEV LAB -->
    <rect class="sign" x="52" y="110" width="150" height="22" rx="10"/>
    <text class="signText" x="64" y="126">DEV LAB</text>

    <!-- DESIGN STUDIO -->
    <rect class="sign" x="52" y="372" width="170" height="22" rx="10"/>
    <text class="signText" x="64" y="388">DESIGN STUDIO</text>

    <!-- QA -->
    <rect class="sign" x="452" y="78" width="70" height="22" rx="10"/>
    <text class="signText" x="462" y="94">QA</text>

    <!-- EBOOKS -->
    <rect class="sign" x="452" y="210" width="90" height="22" rx="10"/>
    <text class="signText" x="462" y="226">EBOOKS</text>

    <!-- WEBSITES -->
    <rect class="sign" x="760" y="112" width="110" height="22" rx="10"/>
    <text class="signText" x="770" y="128">WEBSITES</text>

    <!-- GAMES -->
    <rect class="sign" x="760" y="372" width="90" height="22" rx="10"/>
    <text class="signText" x="770" y="388">GAMES</text>
  </g>

  <!-- Props / furniture (placeholders) -->
  <!-- Library: bookshelf wall + internet desk -->
  <image href="/office/placeholders/bookshelf_topdown_32.png" x="70" y="150" width="32" height="32" opacity="0.95"/>
  <image href="/office/placeholders/bookshelf_topdown_32.png" x="110" y="150" width="32" height="32" opacity="0.95"/>
  <image href="/office/placeholders/bookshelf_topdown_32.png" x="150" y="150" width="32" height="32" opacity="0.95"/>

  <image href="/office/placeholders/desk_topdown_32.png" x="342" y="216" width="32" height="32"/>
  <image href="/office/placeholders/computer_topdown_32.png" x="342" y="206" width="32" height="32"/>
  <image href="/office/placeholders/chair_topdown_32.png" x="342" y="236" width="32" height="32"/>

  <!-- Break room: couch + table -->
  <image href="/office/placeholders/couch_topdown_32.png" x="120" y="435" width="32" height="32"/>
  <image href="/office/placeholders/table_topdown_32.png" x="168" y="442" width="32" height="32"/>

  <!-- Lunch room: long table + chairs -->
  <image href="/office/placeholders/table_topdown_32.png" x="760" y="465" width="32" height="32"/>
  <image href="/office/placeholders/chair_topdown_32.png" x="740" y="485" width="32" height="32"/>
  <image href="/office/placeholders/chair_topdown_32.png" x="792" y="485" width="32" height="32"/>

  <!-- Arcade (Purple Time Machine) -->
  <image href="/office/arcade_purple_time_machine.svg" x="905" y="420" width="32" height="32"/>
  <g>
    <rect class="sign" x="860" y="454" width="150" height="18" rx="9"/>
    <text class="signText" x="868" y="467">Purple Time Machine</text>
  </g>

  <!-- Locksmith office: 3 TVs + 3 desks -->
  <image href="/office/placeholders/tv_topdown_32.png" x="649" y="120" width="32" height="32"/>
  <image href="/office/placeholders/tv_topdown_32.png" x="784" y="120" width="32" height="32"/>
  <image href="/office/placeholders/tv_topdown_32.png" x="899" y="120" width="32" height="32"/>

  <!-- CoquiTees TV station (frog + tshirt) -->
  <image href="/office/placeholders/tv_topdown_32.png" x="649" y="190" width="32" height="32"/>
  <image href="/office/icon_frogshirt.svg" x="657" y="196" width="16" height="16"/>
  <g>
    <rect class="sign" x="608" y="224" width="150" height="18" rx="9"/>
    <text class="signText" x="616" y="237">coquitees.com</text>
  </g>

  <!-- TV labels -->
  <g>
    <rect class="sign" x="620" y="154" width="110" height="18" rx="9"/>
    <text class="signText" x="628" y="167">Veteran L&amp;S</text>

    <rect class="sign" x="755" y="154" width="120" height="18" rx="9"/>
    <text class="signText" x="763" y="167">Alex Locksmith</text>

    <rect class="sign" x="860" y="154" width="140" height="18" rx="9"/>
    <text class="signText" x="868" y="167">FederalLocksmith.com</text>
  </g>

  <image href="/office/placeholders/desk_topdown_32.png" x="674" y="178" width="32" height="32"/>
  <image href="/office/placeholders/computer_topdown_32.png" x="674" y="168" width="32" height="32"/>
  <image href="/office/placeholders/chair_topdown_32.png" x="674" y="198" width="32" height="32"/>

  <image href="/office/placeholders/desk_topdown_32.png" x="814" y="178" width="32" height="32"/>
  <image href="/office/placeholders/computer_topdown_32.png" x="814" y="168" width="32" height="32"/>
  <image href="/office/placeholders/chair_topdown_32.png" x="814" y="198" width="32" height="32"/>

  <image href="/office/placeholders/desk_topdown_32.png" x="744" y="248" width="32" height="32"/>
  <image href="/office/placeholders/computer_topdown_32.png" x="744" y="238" width="32" height="32"/>
  <image href="/office/placeholders/chair_topdown_32.png" x="744" y="268" width="32" height="32"/>

  <!-- Soft vignette -->
  <rect x="0" y="0" width="1000" height="600" fill="rgba(0,0,0,0.10)"/>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sisyphus Tap</title>
    <style>
      html,body{margin:0;height:100%;background:#05060a;color:#eaeaea;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
      #wrap{height:100%;display:grid;place-items:center}
      canvas{background:linear-gradient(180deg,#0b1020,#070812);border:1px solid rgba(255,255,255,.12);border-radius:14px;touch-action:manipulation}
      #hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px;font-size:12px;opacity:.9}
      .pill{padding:8px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.06);backdrop-filter:blur(8px)}
      #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:12px;opacity:.7}
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="pill" id="score">0</div>
      <div class="pill" id="best">best 0</div>
    </div>
    <div id="wrap"><canvas id="c" width="360" height="520"></canvas></div>
    <div id="hint">Tap / click to PUSH. Keep the boulder above the red line.</div>

    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');

      const W = canvas.width, H = canvas.height;
      const lineY = Math.floor(H*0.72);

      let y, vy, score, best, alive;
      best = Number(localStorage.getItem('sisyphus_best')||0);

      function reset(){
        y = Math.floor(H*0.45);
        vy = 0;
        score = 0;
        alive = true;
      }

      function push(){
        if(!alive){ reset(); return; }
        vy -= 6.2; // one mechanic: tap adds upward impulse
      }

      window.addEventListener('pointerdown', (e)=>{ e.preventDefault(); push(); }, { passive:false });
      window.addEventListener('keydown', (e)=>{ if(e.code==='Space') push(); });

      let last = performance.now();
      function loop(t){
        const dt = Math.min(0.033, (t-last)/1000);
        last = t;

        // physics
        if(alive){
          vy += 14*dt; // gravity
          vy *= (1 - 0.8*dt); // tiny drag
          y += vy;

          // scoring: time survived above line
          if(y < lineY) score += dt;

          // fail condition
          if(y >= lineY + 10){
            alive = false;
            best = Math.max(best, Math.floor(score*10));
            localStorage.setItem('sisyphus_best', String(best));
          }
        }

        // draw
        ctx.clearRect(0,0,W,H);

        // red line
        ctx.strokeStyle = 'rgba(255,80,80,.85)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(24, lineY);
        ctx.lineTo(W-24, lineY);
        ctx.stroke();

        // boulder
        const r = 22;
        ctx.fillStyle = 'rgba(210,210,220,.95)';
        ctx.beginPath();
        ctx.arc(W/2, Math.max(r+12, Math.min(H-r-12, y)), r, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.35)';
        ctx.lineWidth = 4;
        ctx.stroke();

        // text
        scoreEl.textContent = String(Math.floor(score*10));
        bestEl.textContent = 'best ' + best;

        if(!alive){
          ctx.fillStyle='rgba(0,0,0,.55)';
          ctx.fillRect(0,0,W,H);
          ctx.fillStyle='#fff';
          ctx.textAlign='center';
          ctx.font='800 22px system-ui';
          ctx.fillText('SLIPPED.', W/2, H*0.42);
          ctx.font='600 14px system-ui';
          ctx.fillText('Tap to try again', W/2, H*0.48);
        }

        requestAnimationFrame(loop);
      }

      reset();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
